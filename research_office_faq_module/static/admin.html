<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FAQ Manager</title><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/admin.css"></head>
<body><main class="admin-shell"><header class="admin-head"><div><p class="eyebrow">BMCC Office of Research</p><h1>FAQ Knowledge Manager</h1><p>Add, search, update, disable, or import reviewed answers.</p></div><a href="/">Open chatbot</a></header>
<section id="login" class="panel login"><h2>Staff access</h2><p>Enter the local prototype admin password.</p><input id="password" type="password" placeholder="Admin password"><button id="login-button" class="primary">Continue</button><p id="login-error" class="error"></p></section>
<div id="workspace" hidden><section class="panel toolbar"><input id="search" type="search" placeholder="Search questions, answers, or categories"><button id="new-button" class="primary">New FAQ</button><label class="import">Import CSV<input id="csv" type="file" accept=".csv"></label></section><section class="grid"><div id="faq-list" class="panel list"></div><form id="editor" class="panel editor"><input id="faq-id" type="hidden"><label>Category<input id="category" required></label><label>Question<textarea id="question" required></textarea></label><label>Reviewed answer<textarea id="answer" rows="7" required></textarea></label><label>Search keywords<input id="keywords"></label><label>Official source URL<input id="source-url" type="url"></label><label class="check"><input id="active" type="checkbox" checked> Available to students</label><div class="actions"><button class="primary" type="submit">Save FAQ</button><button id="delete-button" class="danger" type="button" hidden>Delete</button></div><p id="status"></p></form></section></div></main><script src="/static/admin.js"></script></body></html>
