<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CUNY Beyond Governance</title><link rel="stylesheet" href="/frontend/app_shell.css"><style>
body{margin:0;background:#f3f6fb;font-family:Inter,Arial,sans-serif;color:#17233c}.wrap{max-width:1200px;margin:32px auto;padding:0 18px}.card{background:#fff;border:1px solid #d7e0ed;border-radius:17px;padding:22px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:#edf4fc;border-radius:12px;padding:15px}.metric strong{font-size:28px;display:block}.issues{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.issue{padding:13px;border-radius:11px;background:#fff8dd;border-left:4px solid #e6a700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{font-weight:700;display:grid;gap:6px;margin-bottom:11px}select,input,textarea{padding:10px;border:1px solid #aebed2;border-radius:8px;font:inherit}textarea{min-height:260px;font-family:ui-monospace,monospace;font-size:13px}button{border:0;border-radius:8px;padding:10px 13px;background:#174ea6;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#e8eef7;color:#173d6b}.draft{border-top:1px solid #e2e8f0;padding:13px 0}.draft-actions{display:flex;gap:7px;flex-wrap:wrap}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#e8eef7;font-size:12px;font-weight:800}.catalog{max-height:390px;overflow:auto}.row{padding:8px;border-bottom:1px solid #e2e8f0}.muted{color:#607089}@media(max-width:750px){.metrics,.issues,.grid{grid-template-columns:1fr}}</style></head><body><div id="appShell"></div><main class="wrap"><div class="card"><h1>CUNY Beyond Governance</h1><p class="muted">Create evidence-backed drafts, review them, approve them, and publish only after validation. Public recommendations read published database records, never drafts.</p><div id="metrics" class="metrics"></div><div id="issues" class="issues"></div></div><div class="grid"><section class="card"><h2>New governed draft</h2><label>Record type<select id="entityType"><option value="career">Career</option><option value="skill">Skill</option><option value="program_career">Program-career mapping</option><option value="cpl_guidance">CPL guidance</option><option value="transfer_option">Transfer option</option></select></label><label>Official HTTPS source<input id="sourceUrl" type="url" placeholder="https://..." required></label><label>Record JSON<textarea id="document">{
  "reviewed_at": "2026-08-21",
  "active": true
}</textarea></label><button id="create">Save draft</button><p id="editorStatus" class="muted"></p></section><section class="card"><h2>Workflow</h2><div id="drafts">Loading...</div></section></div><div class="grid"><section class="card"><h2>Career catalog</h2><div id="careers" class="catalog"></div></section><section class="card"><h2>Program-career mappings</h2><div id="mappings" class="catalog"></div></section></div></main><script src="/frontend/app_shell.js"></script><script>
let drafts=[],editingId=null;const label=s=>({draft:'Draft',review:'In review',approved:'Approved',published:'Published',archived:'Archived'}[s]||s);async function json(url,options){const r=await fetch(url,options);const d=await r.json();if(!r.ok)throw new Error(d.detail||'Request failed');return d;}
async function loadDashboard(){const d=await json('/api/db/admin/governance/dashboard');document.getElementById('metrics').innerHTML=Object.entries(d.counts).map(([k,v])=>`<div class="metric"><strong>${v}</strong>${k.replaceAll('_',' ')}</div>`).join('');document.getElementById('issues').innerHTML=Object.entries(d.issues).map(([k,v])=>`<div class="issue"><strong>${k.replaceAll('_',' ')}</strong><div>${v.length?v.join(', '):'No issues found'}</div></div>`).join('');}
async function loadCatalog(){const d=await json('/api/db/admin/governance/catalog');document.getElementById('careers').innerHTML=d.careers.map(x=>`<div class="row"><strong>${x.name}</strong> <span class="pill">${x.active?'active':'inactive'}</span><br><small>${x.slug} · reviewed ${x.reviewed_at}</small></div>`).join('');document.getElementById('mappings').innerHTML=d.program_mappings.map(x=>`<div class="row"><strong>${x.career}</strong> → ${x.program}<br><small>${x.active?'active':'inactive'} · reviewed ${x.reviewed_at}</small></div>`).join('');}
const next={draft:['review'],review:['draft','approved'],approved:['published','draft'],published:['archived'],archived:['draft']};async function loadDrafts(){drafts=await json('/api/db/admin/governance/drafts');document.getElementById('drafts').innerHTML=drafts.length?drafts.map(x=>`<div class="draft"><strong>#${x.id} ${x.entity_type}</strong> <span class="pill">${label(x.status)}</span><br><small>${x.source_url}</small><div class="draft-actions">${(next[x.status]||[]).map(a=>`<button onclick="transition(${x.id},'${a}')">${label(a)}</button>`).join('')}<button class="secondary" onclick="editDraft(${x.id})">Load JSON</button><button class="secondary" onclick="rollbackPrevious(${x.id})">Rollback previous</button></div></div>`).join(''):'No drafts yet.';}
async function transition(id,action){await json(`/api/db/admin/governance/drafts/${id}/transition`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action})});await Promise.all([loadDrafts(),loadDashboard(),loadCatalog()]);}async function rollbackPrevious(id){const versions=await json(`/api/db/admin/governance/drafts/${id}/versions`);if(versions.length<2){alert('No earlier version exists.');return;}const target=versions[1].version_number;if(!confirm(`Restore version ${target} as a new draft?`))return;await json(`/api/db/admin/governance/drafts/${id}/rollback/${target}`,{method:'POST'});await Promise.all([loadDrafts(),loadDashboard()]);}function editDraft(id){const d=drafts.find(x=>x.id===id);editingId=id;document.getElementById('entityType').value=d.entity_type;document.getElementById('sourceUrl').value=d.source_url;document.getElementById('document').value=JSON.stringify(d.document,null,2);document.getElementById('editorStatus').textContent=`Editing draft #${id}. Saving creates an immutable version.`;}
document.getElementById('create').onclick=async()=>{try{const existing=drafts.find(x=>x.id===editingId);const body={entity_type:document.getElementById('entityType').value,entity_id:existing?.entity_id||null,source_url:document.getElementById('sourceUrl').value,document:JSON.parse(document.getElementById('document').value)};await json(editingId?`/api/db/admin/governance/drafts/${editingId}`:'/api/db/admin/governance/drafts',{method:editingId?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});document.getElementById('editorStatus').textContent=editingId?'Draft version saved.':'Draft saved.';editingId=null;await Promise.all([loadDrafts(),loadDashboard()]);}catch(e){document.getElementById('editorStatus').textContent=e.message;}};Promise.all([loadDashboard(),loadCatalog(),loadDrafts()]);
</script><script src="/frontend/session_access.js"></script></body></html>
