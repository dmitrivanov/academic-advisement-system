<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tree-first CS advising prototype · BMCC</title>
  <link rel="stylesheet" href="/frontend/cs_degree_tree_v3.css?v=6">
</head>
<body>
  <header class="site-header">
    <h1>Interactive curriculum map</h1>
    <div class="header-actions">
      <label for="program-select">Selected program</label>
      <select id="program-select" aria-label="Choose a CS department program"></select>
      <div class="completed-summary" aria-live="polite"><strong id="completed-count">0</strong><span>completed courses</span></div>
      <button id="reset-progress" class="quiet-button" type="button">Clear selections</button>
    </div>
  </header>

  <main>
    <span id="progress-bar" hidden></span>

    <section class="workspace" aria-label="Degree tree advising workspace">
      <div class="tree-column">
        <div class="panel-heading">
          <h2 id="tree-title">Loading degree tree…</h2>
          <div class="legend" aria-label="Course status legend">
            <span class="completed">Completed</span><span class="available">Available next</span><span class="locked">Locked</span>
          </div>
        </div>
        <div id="tree-status" class="status-message">Loading the canonical curriculum…</div>
        <div id="degree-tree" class="degree-tree" hidden></div>
      </div>

      <aside class="plan-column" aria-label="Plan preview">
        <section class="next-card">
          <span class="eyebrow">Your next semester</span>
          <h2>Priority courses</h2>
          <div id="next-courses" class="recommendation-list"></div>
        </section>
        <section class="plan-card">
          <div class="plan-card-heading"><div><span class="eyebrow">Prerequisite-safe preview</span><h2>Remaining pathway</h2></div><span id="plan-total" class="plan-total"></span></div>
          <div id="semester-plan" class="semester-plan"></div>
        </section>
      </aside>
    </section>
  </main>
  <script src="/frontend/cs_degree_tree_v3.js?v=6"></script>
</body>
</html>
