<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Term Settings</title><link rel="stylesheet" href="/frontend/app_shell.css"><style>body{margin:0;background:#f3f6fb;font-family:Inter,Arial,sans-serif;color:#17233c}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:22px;margin:15px 0}.term{display:grid;grid-template-columns:2fr 1fr 1.4fr auto;gap:10px;align-items:end;border-top:1px solid #e2e8f0;padding:14px 0}.term:first-child{border:0}label{display:grid;gap:5px;font-weight:700}input{padding:9px;border:1px solid #aebed2;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#174ea6;color:#fff;font-weight:700}.muted{color:#607089}@media(max-width:750px){.term{grid-template-columns:1fr}}</style></head><body><div id="appShell"></div><main class="wrap"><div class="card"><h1>Global Search Terms</h1><p class="muted">Only activate a term after confirming its exact provider code in CUNY Global Search. Student pages show the verification date.</p><div id="terms">Loading...</div></div></main><script src="/frontend/app_shell.js"></script><script>
let terms=[];async function load(){const r=await fetch('/api/db/admin/schedule/terms');terms=await r.json();document.getElementById('terms').innerHTML=terms.map(t=>`<div class="term" data-id="${t.id}"><label>Name<input class="name" value="${t.name}"></label><label>Provider code<input class="code" value="${t.provider_code}"></label><label>Verified date<input class="date" type="date" value="${t.verified_at.slice(0,10)}"></label><label><span>Active</span><input class="active" type="checkbox" ${t.active?'checked':''}></label><button onclick="save(${t.id})">Save</button><a href="${t.source_url}" target="_blank" rel="noopener">Verify source</a></div>`).join('');}async function save(id){const row=document.querySelector(`[data-id="${id}"]`);const current=terms.find(t=>t.id===id);const body={name:row.querySelector('.name').value,provider_code:row.querySelector('.code').value,verified_at:row.querySelector('.date').value+'T00:00:00Z',source_url:current.source_url,active:row.querySelector('.active').checked};const r=await fetch(`/api/db/admin/schedule/terms/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok){alert('Save failed');return}alert('Term saved');await load();}load();
</script><script src="/frontend/session_access.js"></script></body></html>
