<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Schedule Data Settings</title><link rel="stylesheet" href="/frontend/app_shell.css"><style>body{margin:0;background:#f3f6fb;font-family:Inter,Arial,sans-serif;color:#17233c}.wrap{max-width:1050px;margin:35px auto;padding:0 18px}.card{background:#fff;border:1px solid #d7e0ed;border-radius:16px;padding:22px;margin:15px 0}.term,.provider{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;border-top:1px solid #e2e8f0;padding:14px 0}label{display:grid;gap:5px;font-weight:700}input,select{padding:9px;border:1px solid #aebed2;border-radius:8px}button{padding:10px 14px;border:0;border-radius:8px;background:#174ea6;color:#fff;font-weight:700}.muted{color:#607089}.status{padding:12px;border-radius:9px;background:#fff5d8}.wide{grid-column:1/-1}@media(max-width:750px){.term,.provider{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><div id="appShell"></div><main class="wrap"><section class="card"><h1>Schedule Data Settings</h1><p class="muted">Term handoffs remain available. Live sections stay off until an official source is documented, approved, and technically supported.</p><div id="terms">Loading...</div></section><section class="card"><h2>Official live-section provider</h2><p id="providerStatus" class="status" role="status">Loading...</p><div id="provider" class="provider"></div></section></main><script src="/frontend/app_shell.js"></script><script>
let terms=[];async function loadTerms(){const r=await fetch('/api/db/admin/schedule/terms');terms=await r.json();document.getElementById('terms').innerHTML=terms.map(t=>`<div class="term" data-id="${t.id}"><label>Name<input class="name" value="${t.name}"></label><label>Provider code<input class="code" value="${t.provider_code}"></label><label>Verified date<input class="date" type="date" value="${t.verified_at.slice(0,10)}"></label><label><span>Active</span><input class="active" type="checkbox" ${t.active?'checked':''}></label><button onclick="saveTerm(${t.id})">Save term</button><a href="${t.source_url}" target="_blank" rel="noopener">Verify source</a></div>`).join('');}
async function saveTerm(id){const row=document.querySelector(`[data-id="${id}"]`),current=terms.find(t=>t.id===id);const body={name:row.querySelector('.name').value,provider_code:row.querySelector('.code').value,verified_at:row.querySelector('.date').value+'T00:00:00Z',source_url:current.source_url,active:row.querySelector('.active').checked};const r=await fetch(`/api/db/admin/schedule/terms/${id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)return alert('Save failed');alert('Term saved');loadTerms();}
const fields=[['name','Provider name'],['api_base_url','Approved HTTPS API base URL'],['data_owner','Data owner'],['permission_reference','Permission or agreement reference'],['attribution','Required attribution'],['support_contact','Support contact'],['refresh_seconds','Refresh seconds','number'],['retention_seconds','Retention seconds','number']];let provider;
async function loadProvider(){const r=await fetch('/api/db/admin/schedule/provider');provider=await r.json();document.getElementById('providerStatus').textContent=provider.readiness.ready?'Ready':`Not ready: ${provider.readiness.reason.replaceAll('_',' ')}`;document.getElementById('provider').innerHTML=fields.map(([key,label,type])=>`<label class="${key==='permission_reference'||key==='attribution'?'wide':''}">${label}<input id="p_${key}" type="${type||'text'}" value="${provider[key]??''}"></label>`).join('')+`<label>Approval status<select id="p_approval_status"><option>not_approved</option><option>pending</option><option>approved</option><option>revoked</option></select></label><label><span>Enable live provider</span><input id="p_enabled" type="checkbox" ${provider.enabled?'checked':''}></label><label>Last verified<input id="p_last_verified_at" type="date" value="${provider.last_verified_at?provider.last_verified_at.slice(0,10):''}"></label><div class="wide"><button onclick="saveProvider()">Save provider governance</button></div>`;document.getElementById('p_approval_status').value=provider.approval_status;}
async function saveProvider(){const body={};fields.forEach(([key])=>body[key]=document.getElementById('p_'+key).value);body.refresh_seconds=Number(body.refresh_seconds);body.retention_seconds=Number(body.retention_seconds);body.approval_status=document.getElementById('p_approval_status').value;body.enabled=document.getElementById('p_enabled').checked;const date=document.getElementById('p_last_verified_at').value;body.last_verified_at=date?date+'T00:00:00Z':null;const r=await fetch('/api/db/admin/schedule/provider',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json();if(!r.ok)return alert((data.detail?.errors||[data.detail||'Save failed']).join('\n'));alert('Provider governance saved');loadProvider();}
loadTerms();loadProvider();
</script><script src="/frontend/session_access.js"></script></body></html>
