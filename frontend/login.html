<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Login | Academic Advisement System</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f5f7fb;
  margin: 0;
  color: #172033;
}

.container {
  max-width: 430px;
  margin: 90px auto;
  padding: 20px;
}

.card {
  background: white;
  border-radius: 18px;
  padding: 28px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.08);
  border: 1px solid #e6eaf2;
}

h1 {
  margin-bottom: 6px;
}

.subtitle {
  color: #667085;
  margin-top: 0;
  margin-bottom: 24px;
}

label {
  display: block;
  margin-top: 14px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  margin-top: 6px;
  border-radius: 12px;
  border: 1px solid #d7deea;
  font-size: 15px;
  box-sizing: border-box;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 12px 18px;
  border: none;
  border-radius: 12px;
  background: #2563eb;
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

input:focus-visible,
button:focus-visible {
  outline: 3px solid #2563eb;
  outline-offset: 2px;
}

.error {
  color: #b42318;
  font-weight: bold;
  margin-top: 14px;
}

.footer {
  margin-top: 18px;
  color: #667085;
  font-size: 13px;
}

.public-entry {
  margin-top: 18px;
  padding-top: 18px;
  border-top: 1px solid #e6eaf2;
  text-align: center;
}

.public-entry a {
  display: block;
  padding: 12px 18px;
  border: 2px solid #2563eb;
  border-radius: 12px;
  color: #1d4ed8;
  font-weight: bold;
  text-decoration: none;
}

.public-entry a:hover { background: #eff6ff; }
.public-entry p { color: #667085; font-size: 13px; line-height: 1.4; }
</style>
</head>

<body>

<div class="container">
  <div class="card">
    <h1>Academic Advisement System</h1>
    <p class="subtitle">Please log in to access the advising prototype.</p>

    <form method="POST" action="/login">
      <label for="username">Username</label>
      <input type="text" id="username" name="username" autocomplete="username" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit">Log In</button>
    </form>

    <div class="public-entry">
      <a href="/cuny-beyond">Explore careers and BMCC majors</a>
      <p>No account required. Start with what you want to do.</p>
    </div>

    <div id="error" class="error" role="alert" aria-live="assertive"></div>

    <div class="footer">
      Access restricted for project demonstration and development.
    </div>
  </div>
</div>

<script>
const params = new URLSearchParams(window.location.search);
if (params.get("error")) {
  document.getElementById("error").textContent = "Invalid username or password.";
}
</script>

</body>
</html>
